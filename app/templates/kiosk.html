<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ org }} - Visitor Check-in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%91%A4%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="kiosk">
<div class="k-head">
  <div class="brand"><div class="logo">&#128100;</div><span>{{ org }}</span></div>
  <div class="clock" id="clock"></div>
</div>
<div class="k-wrap">
  <div class="cam-col">
    <div class="cam" id="cam">
      <video id="video" autoplay muted playsinline></video>
      <canvas class="ov" id="ov"></canvas>
      <div class="ring"><i></i></div>
      <div class="scan"></div>
      <div class="hint" id="hint">Starting camera...</div>
    </div>
  </div>
  <div class="k-card" id="card"></div>
</div>
<script src="/static/js/common.js"></script>
<script src="/static/js/kiosk.js"></script>
</body></html>
